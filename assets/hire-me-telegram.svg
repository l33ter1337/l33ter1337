 <path d="M-18 -7L21-23C25-25 28-20 25-17L14 23C13 28 9 29 6 24L-4 10L-13 16C-17 19-20 17-19 12L-18-7Z" fill="#7BFFCC"/>
 <path d="M-4 10L20-20L-13 16" fill="none" stroke="#0D6550" stroke-width="3" stroke-linejoin="round"/>
 <path d="M-18-7L20-20" stroke="#D0FFED" stroke-opacity=".7" stroke-width="1.5"/>
</g>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="148" y="58" fill="#E9FFF5" font-size="33" font-weight="800" letter-spacing="1">HIRE ME</text>
 <text x="324" y="58" fill="#67FCC5" font-size="33" font-weight="700" letter-spacing=".5">/ TELEGRAM</text>
 <text x="149" y="93" fill="#B8E4D0" font-size="21" font-weight="500" letter-spacing=".6">PRIVATE UNITY / C# PROJECT INQUIRIES</text>
 <text x="149" y="119" fill="#7EE2B8" font-size="19" letter-spacing="1.5">@Djogdev</text>
</g>
<g>
