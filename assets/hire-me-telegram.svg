 <rect x="862" y="50" width="195" height="50" rx="8" fill="none" stroke="#B9FFE5" stroke-opacity=".55"/>
 <text x="887" y="82" fill="#06281F" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing=".1">OPEN CHAT</text>
 <path d="M1024 71h18m-8-8l8 8-8 8" fill="none" stroke="#06382A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
