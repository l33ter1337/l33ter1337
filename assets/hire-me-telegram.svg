<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 146" role="img" aria-labelledby="title desc">
<title id="title">HIRE ME — Contact on Telegram</title>
<desc id="desc">Freelance project inquiries. Contact @Djogdev directly on Telegram.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07120F"/><stop offset=".52" stop-color="#103127"/><stop offset="1" stop-color="#071719"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F7454"/><stop offset=".45" stop-color="#4DFAC0"/><stop offset="1" stop-color="#147A6B"/></linearGradient>
 <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72FFD0"/><stop offset="1" stop-color="#26C998"/></linearGradient>
 <radialGradient id="radiance"><stop stop-color="#22F1AE" stop-opacity=".27"/><stop offset="1" stop-color="#22F1AE" stop-opacity="0"/></radialGradient>
 <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#53EFBC" stroke-opacity=".07" stroke-width="1"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
 <clipPath id="frame"><rect x="2" y="2" width="1096" height="142" rx="17"/></clipPath>
</defs>
<rect x="2" y="2" width="1096" height="142" rx="17" fill="url(#back)" stroke="url(#edge)" stroke-width="2.3"/>
<g clip-path="url(#frame)">
 <rect width="1100" height="146" fill="url(#mesh)"/>
 <ellipse cx="110" cy="72" rx="180" ry="120" fill="url(#radiance)"/>
 <path d="M-12 132L284 0M854 150L1155-34" stroke="#55EDBA" stroke-opacity=".10" stroke-width="31"/>
 <path d="M3 143L350 0M830 148L1100 14" fill="none" stroke="#59F5B7" stroke-opacity=".30" stroke-width="1.5"/>
 <path d="M0 139H1100" stroke="#4DFFD0" stroke-opacity=".4" stroke-width="2"/>
 <rect x="-400" y="0" width="100" height="146" fill="#9DFFE0" opacity=".025" transform="skewX(-20)">
   <animate attributeName="x" values="-400;1450" dur="7s" repeatCount="indefinite"/>
 </rect>
</g>
<g transform="translate(78 73)">
