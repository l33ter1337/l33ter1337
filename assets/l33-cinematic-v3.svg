  <linearGradient id="rightFacet" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#69ffe1" stop-opacity=".32"/><stop offset=".5" stop-color="#08302a" stop-opacity=".68"/><stop offset="1" stop-color="#04181b" stop-opacity=".9"/></linearGradient>
